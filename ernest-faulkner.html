document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ly: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"78418143-44b0-4b69-9114-67aca37d872f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1d164e10-bc2f-4adc-bcab-ca9015b6ae62\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"110edb43-4404-4db7-ac96-5471b0dc1942\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"78418143-44b0-4b69-9114-67aca37d872f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1d164e10-bc2f-4adc-bcab-ca9015b6ae62\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"110edb43-4404-4db7-ac96-5471b0dc1942\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle><style>body{margin:0;background:#F3F0E8;font-family:Jost,sans-serif;color:#1B1B1B}a{color:#2452A6}a:hover{color:#D63A2F}@media print{[data-artboard]{zoom:1!important}}<\u002Fstyle><\u002Fhelmet>\n<div data-artboard=\"\" style=\"zoom:{{ zoom }};width:1080px;margin:0 auto;background:#F3F0E8;color:#1B1B1B;font-family:Jost,sans-serif\">\n\n<div data-screen-label=\"Hero\" style=\"position:relative;overflow:hidden;padding:62px 56px 76px 112px\">\n<div style=\"position:absolute;left:0;top:0;right:0;height:26px;background:#1B1B1B\"><\u002Fdiv>\n<div style=\"position:absolute;left:72px;top:26px;bottom:0;width:8px;background:#1B1B1B\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px\">\n<div style=\"display:flex;align-items:center;gap:14px;white-space:nowrap\">\n<svg width=\"34\" height=\"24\"><path d=\"M4 22 L17 3 L30 22\" style=\"fill:none;stroke:#1B1B1B;stroke-width:6px\"><\u002Fpath><\u002Fsvg>\n<span style=\"font:600 15px/1 Jost,sans-serif;letter-spacing:.42em\">ATMA<\u002Fspan>\n<span style=\"margin-left:8px;font:500 10px/1 Jost,sans-serif;letter-spacing:.24em;color:#5b5955\">MARKETER · AUTHOR · SYSTEMS ENGINEER<\u002Fspan>\n<\u002Fdiv>\n<a href=\"/ai-brain\" style=\"display:flex;align-items:center;gap:10px;font:500 10px/1 Jost,sans-serif;letter-spacing:.24em;color:#1B1B1B;text-decoration:none;white-space:nowrap\"><span style=\"width:14px;height:12px;background:#F0B323;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan>ATMAOS · AUTHOR BRANCH<\u002Fa>\n<\u002Fdiv>\n<div style=\"margin-top:72px;font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">a new class of machine-driven editorial intelligence<\u002Fdiv>\n<h1 style=\"margin:22px 0 0 -6px;font:700 116px/.9 Jost,sans-serif;letter-spacing:-.035em\">ernest<span style=\"color:#D63A2F\">-<\u002Fspan>faulkner<br>engine<\u002Fh1>\n<div style=\"margin-top:56px;display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:40px;align-items:start\">\n<div>\n<div style=\"width:120px;height:8px;background:#D63A2F\"><\u002Fdiv>\n<div style=\"margin-top:28px;font:500 28px/1.2 Jost,sans-serif;letter-spacing:-.01em\">not AI writing and editing. <strong style=\"font-weight:700;color:#D63A2F\">editorial judgment<\u002Fstrong> — from a machine with a human editor’s mindset.<\u002Fdiv>\n<p style=\"margin:28px 0 0;font:400 17px/1.5 Jost,sans-serif\">Most AI writing tools rewrite first and justify later. Ernest-Faulkner does the opposite. It analyzes what a passage costs the reader, what the writer gains from that choice, argues for leaving it alone, and only recommends intervention when the evidence is strong enough.<\u002Fp>\n<div style=\"margin-top:36px;display:flex;flex-direction:column;gap:12px;font:400 15px/1.3 Jost,sans-serif\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:14px;height:14px;border-radius:50%;background:#2452A6\"><\u002Fspan><span><strong style=\"font-weight:600\">how it thinks<\u002Fstrong> <span style=\"color:#5b5955\">sections 1–8<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:14px;height:14px;background:#D63A2F\"><\u002Fspan><span><strong style=\"font-weight:600\">how it is built<\u002Fstrong> <span style=\"color:#5b5955\">9–13<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:16px;height:14px;background:#F0B323;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan><span><strong style=\"font-weight:600\">the difference<\u002Fstrong> <span style=\"color:#5b5955\">14<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"position:relative;width:520px;height:520px\">\n<div style=\"position:absolute;right:-96px;top:-64px;width:300px;height:260px;background:#F0B323;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fdiv>\n<sc-if value=\"{{ imgOriginal }}\" hint-placeholder-val=\"{{ true }}\"><img src=\"788b5bd4-7076-4292-8d39-3706763a4940\" alt=\"Illustration of Ernest Hemingway and William Faulkner seated in conversation, Faulkner with mechanical legs, over a grid of lines\" style=\"position:relative;display:block;width:520px;height:520px\"><\u002Fsc-if>\n<sc-if value=\"{{ imgMono }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"788b5bd4-7076-4292-8d39-3706763a4940\" alt=\"Illustration of Ernest Hemingway and William Faulkner seated in conversation, Faulkner with mechanical legs, over a grid of lines\" style=\"position:relative;display:block;width:520px;height:520px;filter:grayscale(1) contrast(1.08)\"><\u002Fsc-if>\n<sc-if value=\"{{ imgDuotone }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:relative;width:520px;height:520px;background:#2452A6\"><img src=\"788b5bd4-7076-4292-8d39-3706763a4940\" alt=\"Illustration of Ernest Hemingway and William Faulkner seated in conversation, Faulkner with mechanical legs, over a grid of lines\" style=\"display:block;width:520px;height:520px;filter:grayscale(1) contrast(1.2);mix-blend-mode:multiply\"><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"margin-top:14px;display:flex;gap:12px;align-items:flex-start;font:400 14px/1.4 Jost,sans-serif;color:#5b5955\"><span style=\"flex:none;width:24px;height:3px;background:#1B1B1B;margin-top:9px\"><\u002Fspan><span>Ernest Hemingway and William Faulkner — compression and accumulation, in one conversation.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"The four numbers\" style=\"padding:64px 112px 72px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:26px;background:#1B1B1B;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">the four numbers<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:3px solid #1B1B1B;border-left:3px solid #1B1B1B\">\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 20px 26px;display:flex;flex-direction:column;gap:14px\"><div style=\"font:700 88px/.9 Jost,sans-serif;letter-spacing:-.05em;color:#2452A6\">10<\u002Fdiv><div style=\"font:600 19px/1.15 Jost,sans-serif\">competing editorial forces<\u002Fdiv><div style=\"font:400 14px/1.45 Jost,sans-serif\">Ernest-Faulkner judges 10 fundamental writing tensions — clarity vs. implication, simplicity vs. necessary complexity, restraint vs. emotional force, economy vs. resonance, and more.<\u002Fdiv><div style=\"margin-top:auto;padding-top:14px;border-top:2px solid #1B1B1B\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:8px\">why it matters<\u002Fdiv><div style=\"font:500 15px/1.35 Jost,sans-serif\">It doesn’t apply style rules. It weighs tradeoffs.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 20px 26px;display:flex;flex-direction:column;gap:14px\"><div style=\"font:700 88px/.9 Jost,sans-serif;letter-spacing:-.05em;color:#D63A2F\">15<\u002Fdiv><div style=\"font:600 19px/1.15 Jost,sans-serif\">ways writing can actually fail<\u002Fdiv><div style=\"font:400 14px/1.45 Jost,sans-serif\">Not “bad grammar.” Fifteen families of editorial failure covering meaning, logic, evidence, agency, structure, voice, rhythm, context, and integrity.<\u002Fdiv><div style=\"margin-top:auto;padding-top:14px;border-top:2px solid #1B1B1B\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:8px\">why it matters<\u002Fdiv><div style=\"font:500 15px/1.35 Jost,sans-serif\">It looks for what is actually wrong — not what merely looks unusual.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 20px 26px;display:flex;flex-direction:column;gap:14px\"><div style=\"font:700 88px/.9 Jost,sans-serif;letter-spacing:-.05em;color:#1B1B1B\">120<\u002Fdiv><div style=\"font:600 19px/1.15 Jost,sans-serif\">gold-standard editorial tests<\u002Fdiv><div style=\"font:400 14px/1.45 Jost,sans-serif\">The first evaluation corpus contains 120 difficult cases designed to test judgment, including good writing that conventional AI editors would wrongly “fix.”<\u002Fdiv><div style=\"margin-top:auto;padding-top:14px;border-top:2px solid #1B1B1B\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:8px\">why it matters<\u002Fdiv><div style=\"font:500 15px/1.35 Jost,sans-serif\">The machine is tested on when to edit — and when to leave the writing alone.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 20px 26px;display:flex;flex-direction:column;gap:14px;background:#F0B323\"><div style=\"font:700 88px/.9 Jost,sans-serif;letter-spacing:-.05em;color:#1B1B1B\">30<\u002Fdiv><div style=\"font:600 19px/1.15 Jost,sans-serif\">context-reversal tests<\u002Fdiv><div style=\"font:400 14px/1.45 Jost,sans-serif\">Same or nearly identical words. Different context. Different correct editorial decision.<\u002Fdiv><div style=\"margin-top:auto;padding-top:14px;border-top:2px solid #1B1B1B\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#1B1B1B;margin-bottom:8px\">why it matters<\u002Fdiv><div style=\"font:500 15px/1.35 Jost,sans-serif\">It doesn’t judge the sentence. It judges the sentence in context.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"1 The problem\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">1<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">the problem<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">most AI writing tools are<br>built to rewrite your words.<\u002Fh2>\n<p style=\"margin:0 0 48px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">You give them a paragraph. They make it shorter, smoother, clearer, or more polished. That sounds useful. But it creates a serious problem: the AI often starts writing the way it thinks good writing should sound.<\u002Fp>\n<div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px\">what the rewrite does<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px solid #1B1B1B;border-left:3px solid #1B1B1B\">\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 24px 26px;display:flex;flex-direction:column;gap:18px\"><div style=\"height:42px;display:flex;align-items:center;gap:14px\"><div style=\"display:flex;gap:4px;align-items:flex-end\"><div style=\"width:9px;height:26px;background:#1B1B1B\"><\u002Fdiv><div style=\"width:9px;height:26px;background:#1B1B1B\"><\u002Fdiv><div style=\"width:9px;height:40px;background:#D63A2F\"><\u002Fdiv><div style=\"width:9px;height:26px;background:#1B1B1B\"><\u002Fdiv><\u002Fdiv><svg width=\"26\" height=\"14\" style=\"flex:none\"><path d=\"M0 7 H16\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M14 1 L25 7 L14 13 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg><div style=\"display:flex;gap:4px;align-items:flex-end\"><div style=\"width:9px;height:26px;background:#1B1B1B\"><\u002Fdiv><div style=\"width:9px;height:26px;background:#1B1B1B\"><\u002Fdiv><div style=\"width:9px;height:26px;background:#1B1B1B\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font:500 17px/1.35 Jost,sans-serif\">It removes odd sentences.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 24px 26px;display:flex;flex-direction:column;gap:18px\"><div style=\"height:42px;display:flex;align-items:center;gap:14px\"><div style=\"width:34px;height:34px;border:3px dashed #1B1B1B;box-sizing:border-box\"><\u002Fdiv><svg width=\"26\" height=\"14\" style=\"flex:none\"><path d=\"M0 7 H16\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M14 1 L25 7 L14 13 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg><div style=\"display:flex;gap:5px;align-items:center\"><div style=\"width:34px;height:34px;background:#1B1B1B\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"width:26px;height:4px;background:#1B1B1B\"><\u002Fdiv><div style=\"width:20px;height:4px;background:#1B1B1B\"><\u002Fdiv><div style=\"width:24px;height:4px;background:#1B1B1B\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font:500 17px/1.35 Jost,sans-serif\">It explains things that were meant to stay implied.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 24px 26px;display:flex;flex-direction:column;gap:18px\"><div style=\"height:42px;display:flex;align-items:center;gap:14px\"><div style=\"width:96px;height:8px;background:#1B1B1B\"><\u002Fdiv><svg width=\"26\" height=\"14\" style=\"flex:none\"><path d=\"M0 7 H16\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M14 1 L25 7 L14 13 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg><div style=\"width:28px;height:8px;background:#1B1B1B\"><\u002Fdiv><\u002Fdiv><div style=\"font:500 17px/1.35 Jost,sans-serif\">It shortens long sentences that were working.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 24px 26px;display:flex;flex-direction:column;gap:18px\"><div style=\"height:42px;display:flex;align-items:center;gap:14px\"><div style=\"width:34px;height:34px;background:#D63A2F\"><\u002Fdiv><svg width=\"26\" height=\"14\" style=\"flex:none\"><path d=\"M0 7 H16\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M14 1 L25 7 L14 13 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg><div style=\"width:34px;height:34px;background:#c9c5ba\"><\u002Fdiv><\u002Fdiv><div style=\"font:500 17px/1.35 Jost,sans-serif\">It tones down anger.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 24px 26px;display:flex;flex-direction:column;gap:18px\"><div style=\"height:42px;display:flex;align-items:center;gap:14px\"><div style=\"display:flex;gap:7px\"><div style=\"width:22px;height:8px;background:#1B1B1B\"><\u002Fdiv><div style=\"width:12px;height:8px;background:#1B1B1B\"><\u002Fdiv><div style=\"width:28px;height:8px;background:#1B1B1B\"><\u002Fdiv><\u002Fdiv><svg width=\"26\" height=\"14\" style=\"flex:none\"><path d=\"M0 7 H16\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M14 1 L25 7 L14 13 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg><div style=\"width:76px;height:8px;background:#1B1B1B\"><\u002Fdiv><\u002Fdiv><div style=\"font:500 17px/1.35 Jost,sans-serif\">It cleans up fragments.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 24px 26px;display:flex;flex-direction:column;gap:18px\"><div style=\"height:42px;display:flex;align-items:center;gap:14px\"><div style=\"width:38px;height:34px;background:#F0B323;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fdiv><svg width=\"26\" height=\"14\" style=\"flex:none\"><path d=\"M0 7 H16\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M14 1 L25 7 L14 13 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg><div style=\"width:34px;height:34px;border-radius:50%;background:#c9c5ba\"><\u002Fdiv><\u002Fdiv><div style=\"font:500 17px/1.35 Jost,sans-serif\">It replaces unusual words with safer ones.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);border:3px solid #1B1B1B\">\n<div style=\"padding:28px 30px;border-right:3px solid #1B1B1B\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:12px\">the result may be<\u002Fdiv><div style=\"font:600 32px/1.1 Jost,sans-serif;letter-spacing:-.02em\">easier to read.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:28px 30px;background:#1B1B1B;color:#F3F0E8\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#a9a59b;margin-bottom:12px\">it may also be<\u002Fdiv><div style=\"font:600 32px/1.1 Jost,sans-serif;letter-spacing:-.02em\">less interesting, less precise, less human — <span style=\"color:#F0B323\">and less like you.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:56px;background:#F0B323;padding:44px 48px 48px;position:relative\">\n<div style=\"position:absolute;right:40px;top:40px;width:64px;height:56px;background:#1B1B1B;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fdiv>\n<div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin-bottom:20px\">the idea it was built around<\u002Fdiv>\n<div style=\"font:700 46px/1.06 Jost,sans-serif;letter-spacing:-.03em;max-width:680px\">the AI should have to prove that something is wrong before it earns the right to change it.<\u002Fdiv>\n<div style=\"margin-top:24px;font:500 19px/1.4 Jost,sans-serif\">That sounds simple. It changes almost everything.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"2 Not a rewriting engine\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">2<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">the first question<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 44px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">it is not a<br>rewriting engine.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:3px solid #1B1B1B\">\n<div style=\"padding:30px 32px 34px;border-right:3px solid #1B1B1B\"><div style=\"display:flex;align-items:center;gap:10px;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:18px\"><span style=\"width:12px;height:12px;background:#D63A2F\"><\u002Fspan>it does not begin by asking<\u002Fdiv><div style=\"font:600 34px/1.12 Jost,sans-serif;letter-spacing:-.02em;color:#5b5955;text-decoration:line-through;text-decoration-color:#D63A2F;text-decoration-thickness:4px\">how can I improve this sentence?<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:30px 32px 34px;background:#F0B323\"><div style=\"display:flex;align-items:center;gap:10px;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px\"><span style=\"width:14px;height:12px;background:#1B1B1B;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan>it begins by asking<\u002Fdiv><div style=\"font:700 34px/1.12 Jost,sans-serif;letter-spacing:-.02em\">is there actually a problem here?<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:56px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:40px;align-items:end\">\n<div><div style=\"height:10px;background:#1B1B1B\"><\u002Fdiv><div style=\"margin-top:14px;font:600 20px/1.25 Jost,sans-serif\">A long sentence is not automatically bad.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"width:40px;height:10px;background:#1B1B1B\"><\u002Fdiv><div style=\"margin-top:14px;font:600 20px/1.25 Jost,sans-serif\">A short sentence is not automatically good.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:44px;border-top:3px solid #1B1B1B\">\n<div style=\"display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1fr);gap:24px;padding:14px 0;border-bottom:2px solid #1B1B1B;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\"><span><\u002Fspan><span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;background:#D63A2F\"><\u002Fspan>it can be a problem<\u002Fspan><span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>it can also be the point<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1fr);gap:24px;padding:18px 0;border-bottom:2px solid #1B1B1B;align-items:baseline\"><div style=\"font:600 19px/1.25 Jost,sans-serif\">repetition<\u002Fdiv><div style=\"font:400 16px/1.45 Jost,sans-serif\">It can be wasteful.<\u002Fdiv><div style=\"font:400 16px/1.45 Jost,sans-serif\">It can also create rhythm, pressure, humor, or emotion.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1fr);gap:24px;padding:18px 0;border-bottom:2px solid #1B1B1B;align-items:baseline\"><div style=\"font:600 19px/1.25 Jost,sans-serif\">ambiguity<\u002Fdiv><div style=\"font:400 16px/1.45 Jost,sans-serif\">It can confuse the reader.<\u002Fdiv><div style=\"font:400 16px/1.45 Jost,sans-serif\">It can also be exactly what makes a scene work.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1fr);gap:24px;padding:18px 0;border-bottom:2px solid #1B1B1B;align-items:baseline\"><div style=\"font:600 19px/1.25 Jost,sans-serif\">strong emotional language<\u002Fdiv><div style=\"font:400 16px/1.45 Jost,sans-serif\">It can be melodrama.<\u002Fdiv><div style=\"font:400 16px/1.45 Jost,sans-serif\">It can also be completely justified.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1fr);gap:24px;padding:18px 0;border-bottom:2px solid #1B1B1B;align-items:baseline\"><div style=\"font:600 19px/1.25 Jost,sans-serif\">a difficult sentence<\u002Fdiv><div style=\"font:400 16px/1.45 Jost,sans-serif\">It can be badly written.<\u002Fdiv><div style=\"font:400 16px/1.45 Jost,sans-serif\">Or it can be carrying a difficult idea that should not be made falsely simple.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:48px;display:grid;grid-template-columns:8px 1fr;gap:28px\"><div style=\"background:#D63A2F\"><\u002Fdiv><div style=\"font:600 30px/1.2 Jost,sans-serif;letter-spacing:-.01em\">the engine has to tell the difference.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"3 Cost and gain\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">3<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">cost and gain<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">every editorial choice<br>has a cost and a gain.<\u002Fh2>\n<p style=\"margin:0 0 40px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">This is one of the main ideas behind the system. Every writing choice asks something from the reader. But the same choice may produce something valuable.<\u002Fp>\n<div style=\"position:relative;height:330px\">\n<div style=\"position:absolute;left:150px;top:48px;width:104px;height:104px;background:#D63A2F\"><\u002Fdiv>\n<div style=\"position:absolute;right:150px;top:48px;width:104px;height:104px;border-radius:50%;background:#2452A6\"><\u002Fdiv>\n<div style=\"position:absolute;left:110px;right:110px;top:152px;height:10px;background:#1B1B1B\"><\u002Fdiv>\n<div style=\"position:absolute;left:353px;top:162px;width:150px;height:128px;background:#F0B323;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fdiv>\n<div style=\"position:absolute;left:0;right:0;top:290px;height:4px;background:#1B1B1B\"><\u002Fdiv>\n<div style=\"position:absolute;left:110px;top:184px;width:220px\"><div style=\"font:600 22px/1.1 Jost,sans-serif\">the cost<\u002Fdiv><div style=\"margin-top:6px;font:400 15px/1.4 Jost,sans-serif;color:#5b5955\">what the choice asks of the reader<\u002Fdiv><\u002Fdiv>\n<div style=\"position:absolute;right:110px;top:184px;width:220px;text-align:right\"><div style=\"font:600 22px/1.1 Jost,sans-serif\">the gain<\u002Fdiv><div style=\"margin-top:6px;font:400 15px/1.4 Jost,sans-serif;color:#5b5955\">what the choice may give back<\u002Fdiv><\u002Fdiv>\n<div style=\"position:absolute;left:0;right:0;top:308px;text-align:center;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\">the judgment<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:36px;border:3px solid #1B1B1B\">\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);border-bottom:3px solid #1B1B1B;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\"><div style=\"padding:14px 20px;border-right:3px solid #1B1B1B\">the choice<\u002Fdiv><div style=\"padding:14px 20px;border-right:3px solid #1B1B1B;display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;background:#D63A2F\"><\u002Fspan>what it may cost<\u002Fdiv><div style=\"padding:14px 20px;display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>what it may give back<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);border-bottom:2px solid #1B1B1B\"><div style=\"padding:18px 20px;border-right:3px solid #1B1B1B;font:600 18px/1.25 Jost,sans-serif\">a long sentence<\u002Fdiv><div style=\"padding:18px 20px;border-right:3px solid #1B1B1B;font:400 16px/1.45 Jost,sans-serif\">may require more memory.<\u002Fdiv><div style=\"padding:18px 20px;font:400 16px/1.45 Jost,sans-serif\">may build pressure.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);border-bottom:2px solid #1B1B1B\"><div style=\"padding:18px 20px;border-right:3px solid #1B1B1B;font:600 18px/1.25 Jost,sans-serif\">a metaphor<\u002Fdiv><div style=\"padding:18px 20px;border-right:3px solid #1B1B1B;font:400 16px/1.45 Jost,sans-serif\">may require interpretation.<\u002Fdiv><div style=\"padding:18px 20px;font:400 16px/1.45 Jost,sans-serif\">may explain an idea better than literal language.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);border-bottom:2px solid #1B1B1B\"><div style=\"padding:18px 20px;border-right:3px solid #1B1B1B;font:600 18px/1.25 Jost,sans-serif\">a fragment<\u002Fdiv><div style=\"padding:18px 20px;border-right:3px solid #1B1B1B;font:400 16px/1.45 Jost,sans-serif\">may interrupt the rhythm.<\u002Fdiv><div style=\"padding:18px 20px;font:400 16px/1.45 Jost,sans-serif\">may create force.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr)\"><div style=\"padding:18px 20px;border-right:3px solid #1B1B1B;font:600 18px/1.25 Jost,sans-serif\">a technical word<\u002Fdiv><div style=\"padding:18px 20px;border-right:3px solid #1B1B1B;font:400 16px/1.45 Jost,sans-serif\">may slow a general reader down.<\u002Fdiv><div style=\"padding:18px 20px;font:400 16px/1.45 Jost,sans-serif\">may be the only accurate word.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:36px 0 0;max-width:700px;font:400 17px/1.5 Jost,sans-serif\">So Ernest-Faulkner does not ask whether a writing choice has a cost. Almost every good writing choice has one.<\u002Fp>\n<div style=\"margin-top:24px;background:#1B1B1B;color:#F3F0E8;padding:30px 36px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end\">\n<div style=\"font:600 30px/1.18 Jost,sans-serif;letter-spacing:-.01em\"><span style=\"color:#a9a59b\">it asks:<\u002Fspan> does the value of the choice justify the cost?<\u002Fdiv>\n<div style=\"font:500 11px/1.4 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#F0B323;white-space:nowrap\">that is editorial judgment.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"4 Argues against itself\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">4<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">the case for no change<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">the engine argues<br>against itself.<\u002Fh2>\n<p style=\"margin:0 0 48px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">Most AI systems are very good at finding reasons to change something once they have decided it looks unusual. Ernest-Faulkner is required to do the opposite. Before it recommends a meaningful change, it must make the strongest case it can for leaving the passage alone.<\u002Fp>\n<div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px\">that means the engine may say<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) 190px;border:3px solid #1B1B1B\">\n<div style=\"padding:24px 24px 26px;border-right:3px solid #1B1B1B\"><div style=\"display:flex;align-items:center;gap:8px;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:14px\"><span style=\"width:10px;height:10px;background:#D63A2F\"><\u002Fspan>the cost<\u002Fdiv><div style=\"font:500 19px/1.4 Jost,sans-serif\">This sentence is long and takes more effort to read.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px 24px 26px;border-right:3px solid #1B1B1B\"><div style=\"display:flex;align-items:center;gap:8px;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:14px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>the case for leaving it<\u002Fdiv><div style=\"font:500 19px/1.4 Jost,sans-serif\">But the repeated structure makes the argument easier to follow, and the length creates a strong buildup.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px 22px 26px;background:#F0B323;display:flex;flex-direction:column;justify-content:space-between;gap:16px\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\">verdict<\u002Fdiv><div style=\"font:700 26px/1.1 Jost,sans-serif;letter-spacing:-.01em\">I would leave it alone.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) 190px;border:3px solid #1B1B1B\">\n<div style=\"padding:24px 24px 26px;border-right:3px solid #1B1B1B\"><div style=\"display:flex;align-items:center;gap:8px;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:14px\"><span style=\"width:10px;height:10px;background:#D63A2F\"><\u002Fspan>the cost<\u002Fdiv><div style=\"font:500 19px/1.4 Jost,sans-serif\">This phrase is ambiguous,<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px 24px 26px;border-right:3px solid #1B1B1B\"><div style=\"display:flex;align-items:center;gap:8px;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:14px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>the case for leaving it<\u002Fdiv><div style=\"font:500 19px/1.4 Jost,sans-serif\">but both meanings appear intentional and useful. Clarifying it would make the sentence easier to understand and less interesting.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px 22px 26px;background:#F0B323;display:flex;flex-direction:column;justify-content:space-between;gap:16px\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\">verdict<\u002Fdiv><div style=\"font:700 26px/1.1 Jost,sans-serif;letter-spacing:-.01em\">Keep it.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:48px;background:#1B1B1B;color:#F3F0E8;padding:30px 36px;font:600 28px/1.25 Jost,sans-serif;letter-spacing:-.01em\">the engine does not win by finding more errors.<br><span style=\"color:#F0B323\">it wins by making better decisions.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"5 Observation and judgment\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">5<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">two separate steps<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">it separates observation<br>from judgment.<\u002Fh2>\n<p style=\"margin:0 0 44px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">A normal style checker might detect passive voice — and then recommend active voice. Ernest-Faulkner separates those steps.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:200px auto 26px auto minmax(0,1fr);gap:16px;align-items:center;padding:20px 24px;border:3px solid #1B1B1B\">\n<div style=\"font:500 11px/1.3 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955\">a normal style checker<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 16px/1.2 Jost,sans-serif;white-space:nowrap\"><span style=\"flex:none;width:14px;height:14px;border-radius:50%;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>passive voice<\u002Fdiv>\n<svg width=\"26\" height=\"14\"><path d=\"M0 7 H16\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M14 1 L25 7 L14 13 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 16px/1.2 Jost,sans-serif;white-space:nowrap\"><span style=\"flex:none;width:14px;height:14px;background:#D63A2F\"><\u002Fspan>use active voice<\u002Fdiv>\n<div style=\"font:400 14px/1.4 Jost,sans-serif;color:#5b5955;text-align:right\">the pattern is treated as a rule<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin:40px 0 16px;display:flex;align-items:center;gap:10px;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\"><span style=\"width:14px;height:12px;background:#F0B323;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan>ernest-faulkner<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:170px 44px 190px 52px minmax(0,1fr)\">\n<div style=\"display:flex;align-items:center\"><div style=\"width:100%;border:3px solid #1B1B1B;padding:18px 18px 20px;box-sizing:border-box\"><div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\"><span style=\"width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><span style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\">observation<\u002Fspan><\u002Fdiv><div style=\"font:600 18px/1.25 Jost,sans-serif\">Passive construction detected.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative\"><div style=\"position:absolute;left:0;right:12px;top:calc(50% - 2px);height:4px;background:#1B1B1B\"><\u002Fdiv><div style=\"position:absolute;right:0;top:calc(50% - 8px);width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:13px solid #1B1B1B\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:center\"><div style=\"width:100%;background:#F0B323;padding:18px 18px 20px;box-sizing:border-box\"><div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\"><span style=\"width:18px;height:16px;background:#1B1B1B;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan><span style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\">judgment<\u002Fspan><\u002Fdiv><div style=\"font:600 18px/1.25 Jost,sans-serif\">Does the missing actor matter?<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative\"><div style=\"position:absolute;left:0;width:22px;top:calc(50% - 2px);height:4px;background:#1B1B1B\"><\u002Fdiv><div style=\"position:absolute;left:20px;right:0;top:25%;bottom:25%;border:4px solid #1B1B1B;border-right:none;box-sizing:border-box\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-rows:1fr 1fr;border:3px solid #1B1B1B\">\n<div style=\"padding:20px 22px 22px;border-bottom:3px solid #1B1B1B\"><div style=\"font:600 19px/1.35 Jost,sans-serif\">The samples were stored at −80°C.<\u002Fdiv><div style=\"margin-top:6px;font:400 14px/1.45 Jost,sans-serif;color:#5b5955\">The person who put them in the freezer may not matter at all.<\u002Fdiv><div style=\"margin-top:14px;display:flex;align-items:center;gap:8px;font:600 16px/1 Jost,sans-serif\"><span style=\"width:14px;height:14px;border-radius:50%;background:#2452A6\"><\u002Fspan>leave it alone.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:20px 22px 22px\"><div style=\"font:600 19px/1.35 Jost,sans-serif\">The records were destroyed after the investigation began.<\u002Fdiv><div style=\"margin-top:6px;font:400 14px/1.45 Jost,sans-serif;color:#5b5955\">The missing actor may matter a great deal.<\u002Fdiv><div style=\"margin-top:14px;display:flex;align-items:center;gap:8px;font:600 16px/1 Jost,sans-serif\"><span style=\"width:14px;height:14px;background:#D63A2F\"><\u002Fspan>now there may be a real agency problem.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:48px;display:grid;grid-template-columns:8px 1fr;gap:28px\"><div style=\"background:#D63A2F\"><\u002Fdiv><div><div style=\"font:600 30px/1.2 Jost,sans-serif;letter-spacing:-.01em;max-width:720px\">the same surface feature can produce opposite editorial judgments.<\u002Fdiv><p style=\"margin:14px 0 0;font:400 17px/1.5 Jost,sans-serif\">That is why the engine does not treat grammar patterns as rules.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"6 Competing editorial forces\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">6<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">ten editorial tensions<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">it works through competing<br>editorial forces.<\u002Fh2>\n<p style=\"margin:0 0 40px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">The system is built around a set of editorial tensions. These are not sliders where the best answer is always somewhere in the middle.<\u002Fp>\n<div style=\"position:relative;padding-top:40px\">\n<div style=\"position:absolute;left:calc(50% - 1.5px);top:0;bottom:0;border-left:3px dashed #D63A2F\"><\u002Fdiv>\n<div style=\"position:absolute;left:calc(50% + 14px);top:2px;display:flex;align-items:center;gap:8px;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap\"><span style=\"width:10px;height:10px;background:#D63A2F\"><\u002Fspan>the middle is not automatically right<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:20px;align-items:center;padding:11px 0\"><div style=\"text-align:right;font:500 19px/1.2 Jost,sans-serif\">compression<\u002Fdiv><div style=\"display:flex;align-items:center\"><span style=\"flex:none;width:16px;height:16px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv><div style=\"font:500 19px/1.2 Jost,sans-serif\">accumulation<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:20px;align-items:center;padding:11px 0\"><div style=\"text-align:right;font:500 19px/1.2 Jost,sans-serif\">explicitness<\u002Fdiv><div style=\"display:flex;align-items:center\"><span style=\"flex:none;width:16px;height:16px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv><div style=\"font:500 19px/1.2 Jost,sans-serif\">implication<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:20px;align-items:center;padding:11px 0\"><div style=\"text-align:right;font:500 19px/1.2 Jost,sans-serif\">precision<\u002Fdiv><div style=\"display:flex;align-items:center\"><span style=\"flex:none;width:16px;height:16px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv><div style=\"font:500 19px/1.2 Jost,sans-serif\">productive ambiguity<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:20px;align-items:center;padding:11px 0\"><div style=\"text-align:right;font:500 19px/1.2 Jost,sans-serif\">speed<\u002Fdiv><div style=\"display:flex;align-items:center\"><span style=\"flex:none;width:16px;height:16px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv><div style=\"font:500 19px/1.2 Jost,sans-serif\">immersion<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:20px;align-items:center;padding:11px 0\"><div style=\"text-align:right;font:500 19px/1.2 Jost,sans-serif\">simplicity<\u002Fdiv><div style=\"display:flex;align-items:center\"><span style=\"flex:none;width:16px;height:16px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv><div style=\"font:500 19px/1.2 Jost,sans-serif\">necessary complexity<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:20px;align-items:center;padding:11px 0\"><div style=\"text-align:right;font:500 19px/1.2 Jost,sans-serif\">regularity<\u002Fdiv><div style=\"display:flex;align-items:center\"><span style=\"flex:none;width:16px;height:16px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv><div style=\"font:500 19px/1.2 Jost,sans-serif\">disruption<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:20px;align-items:center;padding:11px 0\"><div style=\"text-align:right;font:500 19px/1.2 Jost,sans-serif\">restraint<\u002Fdiv><div style=\"display:flex;align-items:center\"><span style=\"flex:none;width:16px;height:16px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv><div style=\"font:500 19px/1.2 Jost,sans-serif\">emotional force<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:20px;align-items:center;padding:11px 0\"><div style=\"text-align:right;font:500 19px/1.2 Jost,sans-serif\">linear progression<\u002Fdiv><div style=\"display:flex;align-items:center\"><span style=\"flex:none;width:16px;height:16px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv><div style=\"font:500 19px/1.2 Jost,sans-serif\">associative movement<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:20px;align-items:center;padding:11px 0\"><div style=\"text-align:right;font:500 19px/1.2 Jost,sans-serif\">transparency<\u002Fdiv><div style=\"display:flex;align-items:center\"><span style=\"flex:none;width:16px;height:16px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv><div style=\"font:500 19px/1.2 Jost,sans-serif\">textural richness<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:20px;align-items:center;padding:11px 0\"><div style=\"text-align:right;font:500 19px/1.2 Jost,sans-serif\">economy<\u002Fdiv><div style=\"display:flex;align-items:center\"><span style=\"flex:none;width:16px;height:16px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fspan><span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv><div style=\"font:500 19px/1.2 Jost,sans-serif\">resonance<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:3px solid #1B1B1B\">\n<div style=\"padding:24px 28px 26px 0;border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B\"><div style=\"height:26px;display:flex;align-items:center\"><div style=\"width:36px;height:10px;background:#1B1B1B\"><\u002Fdiv><\u002Fdiv><div style=\"margin-top:16px;font:500 18px/1.35 Jost,sans-serif\">Sometimes the right sentence should be brutally short.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px 0 26px 28px;border-bottom:3px solid #1B1B1B\"><div style=\"height:26px;display:flex;align-items:center\"><div style=\"width:100%;height:10px;background:#1B1B1B\"><\u002Fdiv><\u002Fdiv><div style=\"margin-top:16px;font:500 18px/1.35 Jost,sans-serif\">Sometimes it should run for half a page.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px 28px 26px 0;border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B\"><div style=\"height:26px;display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#1B1B1B\"><\u002Fdiv><\u002Fdiv><div style=\"margin-top:16px;font:500 18px/1.35 Jost,sans-serif\">Sometimes the writer should explain the point clearly.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px 0 26px 28px;border-bottom:3px solid #1B1B1B\"><div style=\"height:26px;display:flex;align-items:center\"><div style=\"width:26px;height:26px;border:3px dashed #1B1B1B;box-sizing:border-box\"><\u002Fdiv><\u002Fdiv><div style=\"margin-top:16px;font:500 18px/1.35 Jost,sans-serif\">Sometimes explaining it would kill it.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px 28px 26px 0;border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B\"><div style=\"height:26px;display:flex;align-items:center\"><div style=\"width:26px;height:26px;border-radius:50%;border:2px solid #1B1B1B;box-sizing:border-box\"><\u002Fdiv><\u002Fdiv><div style=\"margin-top:16px;font:500 18px/1.35 Jost,sans-serif\">Sometimes the language should disappear so the reader sees only the information.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px 0 26px 28px;border-bottom:3px solid #1B1B1B\"><div style=\"height:26px;display:flex;align-items:center\"><div style=\"width:26px;height:26px;border-radius:50%;border:2px solid #1B1B1B;box-sizing:border-box;background:repeating-linear-gradient(45deg,#1B1B1B 0 3px,#F3F0E8 3px 7px)\"><\u002Fdiv><\u002Fdiv><div style=\"margin-top:16px;font:500 18px/1.35 Jost,sans-serif\">Sometimes the language itself is part of the experience.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:40px;background:#1B1B1B;color:#F3F0E8;padding:30px 36px;font:600 26px/1.25 Jost,sans-serif;letter-spacing:-.01em\">the engine asks what the passage is trying to do — and judges the choice against that purpose.<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"7 Context\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">7<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">context<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">context can completely<br>change the answer.<\u002Fh2>\n<p style=\"margin:0 0 48px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">Ernest-Faulkner does not judge sentences in a vacuum. Consider one sentence.<\u002Fp>\n<div style=\"text-align:center;font:700 72px/1 Jost,sans-serif;letter-spacing:-.035em\">“Mistakes were made.”<\u002Fdiv>\n<svg width=\"856\" height=\"80\" style=\"display:block;margin:28px 0 0\"><path d=\"M428 0 L214 78 M428 0 L642 78\" style=\"fill:none;stroke:#1B1B1B;stroke-width:4px\"><\u002Fpath><\u002Fsvg>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px\">\n<div>\n<div style=\"border:3px solid #1B1B1B;background:#fff;padding:22px 24px 26px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:3px solid #1B1B1B;margin-bottom:18px\"><span style=\"font:600 12px/1 Jost,sans-serif;letter-spacing:.24em\">STATEMENT<\u002Fspan><span style=\"width:12px;height:12px;background:#1B1B1B\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:5px;background:#c9c5ba;width:94%\"><\u002Fdiv><div style=\"height:5px;background:#c9c5ba;width:100%\"><\u002Fdiv><div style=\"height:5px;background:#c9c5ba;width:68%\"><\u002Fdiv><\u002Fdiv>\n<div style=\"margin:16px 0\"><span style=\"font:600 22px/1.3 Jost,sans-serif;border-bottom:4px solid #D63A2F\">Mistakes were made.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:5px;background:#c9c5ba;width:100%\"><\u002Fdiv><div style=\"height:5px;background:#c9c5ba;width:86%\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:20px;display:flex;align-items:flex-start;gap:12px\"><span style=\"flex:none;width:18px;height:18px;background:#D63A2F;margin-top:2px\"><\u002Fspan><div><div style=\"font:500 11px/1.3 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:8px\">a corporate statement after misconduct<\u002Fdiv><div style=\"font:600 20px/1.25 Jost,sans-serif\">agency problem.<\u002Fdiv><div style=\"margin-top:6px;font:400 15px/1.45 Jost,sans-serif\">The sentence may hide responsibility. That is a problem.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"border:3px solid #1B1B1B;background:#fff;padding:22px 24px 26px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:3px solid #1B1B1B;margin-bottom:18px\"><span style=\"font:600 12px/1 Jost,sans-serif;letter-spacing:.24em\">CHAPTER 9<\u002Fspan><span style=\"width:12px;height:12px;border-radius:50%;background:#1B1B1B\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:5px;background:#c9c5ba;width:100%\"><\u002Fdiv><div style=\"height:5px;background:#c9c5ba;width:90%\"><\u002Fdiv><\u002Fdiv>\n<div style=\"margin:16px 0;font:500 20px/1.4 Jost,sans-serif\"><span style=\"font-weight:600;border-bottom:4px solid #2452A6\">“Mistakes were made,”<\u002Fspan> Daniel said, staring at the floor.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:5px;background:#c9c5ba;width:100%\"><\u002Fdiv><div style=\"height:5px;background:#c9c5ba;width:74%\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:20px;display:flex;align-items:flex-start;gap:12px\"><span style=\"flex:none;width:18px;height:18px;border-radius:50%;background:#2452A6;margin-top:2px\"><\u002Fspan><div><div style=\"font:500 11px/1.3 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:8px\">a cowardly character in a novel<\u002Fdiv><div style=\"font:600 20px/1.25 Jost,sans-serif\">good characterization.<\u002Fdiv><div style=\"margin-top:6px;font:400 15px/1.45 Jost,sans-serif\">Now the hidden responsibility may be the whole point.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:3px solid #1B1B1B\">\n<div style=\"padding:28px 30px;border-right:3px solid #1B1B1B;font:600 30px/1.15 Jost,sans-serif;letter-spacing:-.02em\">the sentence did not change.<\u002Fdiv>\n<div style=\"padding:28px 30px;background:#1B1B1B;color:#F3F0E8;font:600 30px/1.15 Jost,sans-serif;letter-spacing:-.02em\">the context did.<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:28px 0 0;max-width:720px;font:400 17px/1.5 Jost,sans-serif\">A real editor understands that. The engine is being designed to understand it too — its 30 context-reversal tests check exactly this: the same or nearly identical words, a different context, and a different correct editorial decision.<\u002Fp>\n<\u002Fdiv>\n\n<div data-screen-label=\"8 Voice\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">8<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">voice<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">it protects the writer<br>from the AI.<\u002Fh2>\n<p style=\"margin:0 0 44px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">AI is very good at producing language that sounds clean, balanced, professional, and reasonable. That is also how it can destroy a writer’s voice.<\u002Fp>\n<div style=\"border-top:3px solid #1B1B1B\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:24px;padding:14px 0;border-bottom:2px solid #1B1B1B;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\"><span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>the writer wrote<\u002Fspan><span><\u002Fspan><span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;background:#D63A2F\"><\u002Fspan>what AI can turn it into<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:24px;padding:28px 0;border-bottom:2px solid #1B1B1B;align-items:center\"><div style=\"font:700 44px/1.05 Jost,sans-serif;letter-spacing:-.03em\">They lied.<\u002Fdiv><svg width=\"44\" height=\"20\"><path d=\"M0 10 H30\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M26 2 L42 10 L26 18 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg><div style=\"font:400 22px/1.35 Jost,sans-serif;color:#5b5955;text-decoration:line-through;text-decoration-color:#D63A2F;text-decoration-thickness:3px\">Their statements may not have been fully accurate.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:24px;padding:28px 0;border-bottom:2px solid #1B1B1B;align-items:center\"><div style=\"font:700 44px/1.05 Jost,sans-serif;letter-spacing:-.03em\">Ain’t nobody told me nothing.<\u002Fdiv><svg width=\"44\" height=\"20\"><path d=\"M0 10 H30\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M26 2 L42 10 L26 18 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg><div style=\"font:400 22px/1.35 Jost,sans-serif;color:#5b5955;text-decoration:line-through;text-decoration-color:#D63A2F;text-decoration-thickness:3px\">No one told me anything.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:24px;padding:24px 0;border-bottom:2px solid #1B1B1B;align-items:center\"><div style=\"font:600 22px/1.3 Jost,sans-serif\">a strange, memorable sentence<\u002Fdiv><svg width=\"44\" height=\"20\"><path d=\"M0 10 H30\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M26 2 L42 10 L26 18 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg><div style=\"font:400 20px/1.35 Jost,sans-serif;color:#5b5955;text-decoration:line-through;text-decoration-color:#D63A2F;text-decoration-thickness:3px\">a sentence that could have been written by anyone<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:36px 0 0;max-width:700px;font:400 17px/1.5 Jost,sans-serif\">Ernest-Faulkner treats voice as something worth protecting.<\u002Fp>\n<div style=\"margin-top:24px;display:flex;flex-direction:column;gap:6px\">\n<div style=\"width:70%;background:#F0B323;padding:20px 28px;font:600 22px/1.25 Jost,sans-serif;box-sizing:border-box\">a cleaner sentence is not automatically a better sentence.<\u002Fdiv>\n<div style=\"width:85%;background:#D63A2F;color:#fff;padding:20px 28px;font:600 22px/1.25 Jost,sans-serif;box-sizing:border-box\">a clearer sentence is not automatically better if the clarity destroys the intended experience.<\u002Fdiv>\n<div style=\"width:100%;background:#2452A6;color:#fff;padding:20px 28px;font:600 22px/1.25 Jost,sans-serif;box-sizing:border-box\">and a revision is never better if it becomes less true.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part two divider\" style=\"background:#1B1B1B;color:#F3F0E8;padding:60px 112px;border-top:8px solid #1B1B1B;display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:center\">\n<div><div style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#F0B323;margin-bottom:18px\">part two · how it is built<\u002Fdiv><div style=\"font:700 44px/1.05 Jost,sans-serif;letter-spacing:-.03em\">what keeps the machine from simply rewriting.<\u002Fdiv><\u002Fdiv>\n<p style=\"margin:0;font:400 17px/1.5 Jost,sans-serif;color:#d9d5cb\">The process, the safeguards, the rules, and the tests behind the engine. Ernest-Faulkner is in development: its test corpus already exists and is growing, and the final editorial intelligence is being built against it.<\u002Fp>\n<\u002Fdiv>\n\n<div data-screen-label=\"9 The process\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-
