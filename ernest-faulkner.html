content:center;font:600 13px/1 Jost,sans-serif\">9<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">the process<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">judgment and rewriting<br>are separate jobs.<\u002Fh2>\n<p style=\"margin:0 0 44px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">Most AI writing tools mix these together. They see a possible problem and immediately start rewriting. Ernest-Faulkner separates them. The process is closer to this:<\u002Fp>\n<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\"><span style=\"width:14px;height:12px;background:#F0B323;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan>judgment<\u002Fdiv>\n<div style=\"position:relative\">\n<div style=\"position:absolute;left:21px;top:36px;bottom:36px;width:4px;background:#1B1B1B\"><\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:46px 340px minmax(0,1fr);gap:28px;align-items:center;padding:13px 0\"><div style=\"width:46px;height:46px;border-radius:50%;background:#1B1B1B;color:#fff;display:flex;align-items:center;justify-content:center;font:600 17px/1 Jost,sans-serif\">1<\u002Fdiv><div style=\"font:600 20px/1.2 Jost,sans-serif\">Observe the text.<\u002Fdiv><div style=\"font:400 16px/1.4 Jost,sans-serif;color:#5b5955\">What is actually happening?<\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:46px 340px minmax(0,1fr);gap:28px;align-items:center;padding:13px 0\"><div style=\"width:46px;height:46px;border-radius:50%;background:#D63A2F;color:#fff;display:flex;align-items:center;justify-content:center;font:600 17px/1 Jost,sans-serif\">2<\u002Fdiv><div style=\"font:600 20px/1.2 Jost,sans-serif\">Identify the possible reader cost.<\u002Fdiv><div style=\"font:400 16px/1.4 Jost,sans-serif;color:#5b5955\">What makes this harder, slower, less precise, or less effective?<\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:46px 340px minmax(0,1fr);gap:28px;align-items:center;padding:13px 0\"><div style=\"width:46px;height:46px;border-radius:50%;background:#2452A6;color:#fff;display:flex;align-items:center;justify-content:center;font:600 17px/1 Jost,sans-serif\">3<\u002Fdiv><div style=\"font:600 20px/1.2 Jost,sans-serif\">Identify the possible gain.<\u002Fdiv><div style=\"font:400 16px/1.4 Jost,sans-serif;color:#5b5955\">What might the writer be getting in return?<\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:46px 340px minmax(0,1fr);gap:28px;align-items:center;padding:13px 0\"><div style=\"width:46px;height:46px;border-radius:50%;background:#F0B323;color:#1B1B1B;display:flex;align-items:center;justify-content:center;font:600 17px/1 Jost,sans-serif\">4<\u002Fdiv><div style=\"font:600 20px/1.2 Jost,sans-serif\">Make the strongest case for leaving it alone.<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:46px 340px minmax(0,1fr);gap:28px;align-items:center;padding:13px 0\"><div style=\"width:46px;height:46px;border-radius:50%;background:#F3F0E8;border:3px solid #1B1B1B;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:600 17px/1 Jost,sans-serif\">5<\u002Fdiv><div style=\"font:600 20px/1.2 Jost,sans-serif\">Decide whether there is really a problem.<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:46px 340px minmax(0,1fr);gap:28px;align-items:center;padding:13px 0\"><div style=\"width:46px;height:46px;border-radius:50%;background:#F3F0E8;border:3px solid #1B1B1B;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:600 17px/1 Jost,sans-serif\">6<\u002Fdiv><div style=\"font:600 20px/1.2 Jost,sans-serif\">Decide whether intervention is justified.<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:46px 340px minmax(0,1fr);gap:28px;align-items:center;padding:13px 0\"><div style=\"width:46px;height:46px;border-radius:50%;background:#1B1B1B;color:#fff;display:flex;align-items:center;justify-content:center;font:600 17px/1 Jost,sans-serif\">7<\u002Fdiv><div style=\"font:600 20px/1.2 Jost,sans-serif\">Define exactly what may be changed.<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin:32px 0;position:relative;height:12px;background:#1B1B1B\"><span style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#F3F0E8;border:3px solid #1B1B1B;border-radius:999px;padding:7px 16px;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap\">the boundary<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:46px minmax(0,1fr);gap:28px;align-items:center\">\n<div style=\"width:46px;height:46px;background:#D63A2F\"><\u002Fdiv>\n<div><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:8px\">rewriting · a separate job<\u002Fdiv><div style=\"font:600 24px/1.2 Jost,sans-serif;letter-spacing:-.01em\">Only then can a revision system touch the prose.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:48px;background:#1B1B1B;color:#F3F0E8;padding:30px 36px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center\">\n<div style=\"font:600 26px/1.2 Jost,sans-serif;letter-spacing:-.01em\">that boundary matters.<\u002Fdiv>\n<p style=\"margin:0;font:400 16px/1.5 Jost,sans-serif;color:#d9d5cb\">It keeps the AI from turning every editorial observation into a rewrite.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"10 Revision checks\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">10<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">revision checks<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">even a good revision<br>can fail.<\u002Fh2>\n<p style=\"margin:0 0 44px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">Suppose the engine finds an unclear pronoun. It fixes the pronoun. Good. But the new sentence also changes who is responsible for the action. That revision fails.<\u002Fp>\n<div style=\"border:3px solid #1B1B1B\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 140px;border-bottom:3px solid #1B1B1B;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\"><div style=\"padding:14px 22px;border-right:3px solid #1B1B1B;display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>the fix<\u002Fdiv><div style=\"padding:14px 22px;border-right:3px solid #1B1B1B;display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;background:#D63A2F\"><\u002Fspan>what it broke<\u002Fdiv><div style=\"padding:14px 22px\">result<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 140px;border-bottom:2px solid #1B1B1B;align-items:stretch\"><div style=\"padding:20px 22px;border-right:3px solid #1B1B1B;font:500 18px/1.35 Jost,sans-serif\">It fixes an unclear pronoun.<\u002Fdiv><div style=\"padding:20px 22px;border-right:3px solid #1B1B1B;font:400 17px/1.4 Jost,sans-serif\">The new sentence changes who is responsible for the action.<\u002Fdiv><div style=\"padding:20px 22px;font:700 26px/1 Jost,sans-serif;color:#D63A2F;display:flex;align-items:center\">fails.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 140px;border-bottom:2px solid #1B1B1B;align-items:stretch\"><div style=\"padding:20px 22px;border-right:3px solid #1B1B1B;font:500 18px/1.35 Jost,sans-serif\">It makes the sentence clearer.<\u002Fdiv><div style=\"padding:20px 22px;border-right:3px solid #1B1B1B;font:400 17px/1.4 Jost,sans-serif\">It removes a joke.<\u002Fdiv><div style=\"padding:20px 22px;font:700 26px/1 Jost,sans-serif;color:#D63A2F;display:flex;align-items:center\">fails.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 140px;align-items:stretch\"><div style=\"padding:20px 22px;border-right:3px solid #1B1B1B;font:500 18px/1.35 Jost,sans-serif\">It shortens a paragraph.<\u002Fdiv><div style=\"padding:20px 22px;border-right:3px solid #1B1B1B;font:400 17px/1.4 Jost,sans-serif\">It destroys a phrase that returns at the end of the chapter.<\u002Fdiv><div style=\"padding:20px 22px;font:700 26px/1 Jost,sans-serif;color:#D63A2F;display:flex;align-items:center\">fails.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:48px;background:#F0B323;padding:36px 40px 40px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;align-items:start\">\n<div style=\"font:600 28px/1.12 Jost,sans-serif;letter-spacing:-.01em\">every revision is checked against what must survive<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 20px\">\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>meaning<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>facts<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>agency<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>attribution<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>certainty<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>causality<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>scope<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>voice<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>rhythm<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>humor<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>emotional posture<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>ambiguity<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>character<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font:500 17px/1.2 Jost,sans-serif\"><span style=\"flex:none;width:16px;height:16px;border:3px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>motifs and callbacks<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:40px;display:grid;grid-template-columns:170px minmax(0,1fr);border-top:3px solid #1B1B1B\">\n<div style=\"padding:24px 0;border-bottom:2px solid #1B1B1B;font:500 11px/1.3 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955\">the goal is not simply<\u002Fdiv>\n<div style=\"padding:18px 0;border-bottom:2px solid #1B1B1B;font:600 26px/1.2 Jost,sans-serif;color:#5b5955;text-decoration:line-through;text-decoration-color:#D63A2F;text-decoration-thickness:3px\">did the sentence improve?<\u002Fdiv>\n<div style=\"padding:24px 0;font:500 11px/1.3 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\">it is<\u002Fdiv>\n<div style=\"padding:18px 0;font:700 30px/1.18 Jost,sans-serif;letter-spacing:-.01em\">did we solve the identified problem without breaking anything that was already working?<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"11 Silence\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">11<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">silence<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">the engine is allowed<br>to say nothing.<\u002Fh2>\n<p style=\"margin:0 0 44px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">Most software feels useful only when it produces output, so writing tools tend to generate lots of suggestions. Ernest-Faulkner treats silence as a valid editorial decision.<\u002Fp>\n<div style=\"border-top:3px solid #1B1B1B\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:center;padding:26px 0;border-bottom:2px solid #1B1B1B\"><div style=\"font:400 20px/1.4 Jost,sans-serif\">If a sentence is unusual but working<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:4px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan><span style=\"font:700 36px/1 Jost,sans-serif;letter-spacing:-.02em\">no action.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:center;padding:26px 0;border-bottom:2px solid #1B1B1B\"><div style=\"font:400 20px/1.4 Jost,sans-serif\">If the evidence is weak<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:4px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan><span style=\"font:700 36px/1 Jost,sans-serif;letter-spacing:-.02em\">no action.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:center;padding:26px 0;border-bottom:2px solid #1B1B1B\"><div style=\"font:400 20px/1.4 Jost,sans-serif\">If the issue is merely preference<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"flex:none;width:30px;height:30px;border-radius:50%;border:4px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan><span style=\"font:700 36px/1 Jost,sans-serif;letter-spacing:-.02em\">no action.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:center;padding:26px 0;border-bottom:2px solid #1B1B1B\"><div style=\"font:400 20px/1.4 Jost,sans-serif\">If the engine cannot tell whether the writer intended something<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"flex:none;width:34px;height:30px;background:#F0B323;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan><span style=\"font:700 36px/1 Jost,sans-serif;letter-spacing:-.02em\">ask a question.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:48px;display:grid;grid-template-columns:8px 1fr;gap:28px\"><div style=\"background:#D63A2F\"><\u002Fdiv><div style=\"font:600 30px/1.2 Jost,sans-serif;letter-spacing:-.01em;max-width:720px\">the engine is not trying to prove its value by constantly touching the prose.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"12 Governed rules\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">12<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">governed rules<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">its rules are governed,<br>not hidden in prompts.<\u002Fh2>\n<p style=\"margin:0 0 44px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">Most AI editing systems rely heavily on prompts. That leaves a huge amount of editorial policy hidden inside the model. Ernest-Faulkner is being built differently.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px;align-items:stretch\">\n<div style=\"display:flex;flex-direction:column\">\n<div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:14px\">a typical editing prompt<\u002Fdiv>\n<div style=\"flex:1;border:3px dashed #1B1B1B;padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px\"><div style=\"font:500 22px/1.35 Jost,sans-serif\">“Act as an expert editor. Improve clarity, style, flow, and readability.”<\u002Fdiv><div style=\"display:flex;align-items:center;gap:10px;font:400 14px/1.4 Jost,sans-serif;color:#5b5955\"><span style=\"flex:none;width:12px;height:12px;background:#D63A2F\"><\u002Fspan>the editorial policy stays hidden inside the model<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column\">\n<div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px\">every ernest-faulkner rule has<\u002Fdiv>\n<div style=\"flex:1;border:3px solid #1B1B1B;display:grid;grid-template-columns:1fr 1fr\">\n<div style=\"padding:16px 18px;border-right:2px solid #1B1B1B;border-bottom:2px solid #1B1B1B;display:flex;align-items:center;gap:12px;font:500 16px/1.25 Jost,sans-serif\"><span style=\"flex:none;width:12px;height:12px;background:#1B1B1B\"><\u002Fspan>a name<\u002Fdiv>\n<div style=\"padding:16px 18px;border-bottom:2px solid #1B1B1B;display:flex;align-items:center;gap:12px;font:500 16px/1.25 Jost,sans-serif\"><span style=\"flex:none;width:12px;height:12px;background:#1B1B1B\"><\u002Fspan>a version<\u002Fdiv>\n<div style=\"padding:16px 18px;border-right:2px solid #1B1B1B;border-bottom:2px solid #1B1B1B;display:flex;align-items:center;gap:12px;font:500 16px/1.25 Jost,sans-serif\"><span style=\"flex:none;width:12px;height:12px;border-radius:50%;background:#2452A6\"><\u002Fspan>evidence requirements<\u002Fdiv>\n<div style=\"padding:16px 18px;border-bottom:2px solid #1B1B1B;display:flex;align-items:center;gap:12px;font:500 16px/1.25 Jost,sans-serif\"><span style=\"flex:none;width:12px;height:12px;border-radius:50%;background:#2452A6\"><\u002Fspan>exceptions<\u002Fdiv>\n<div style=\"padding:16px 18px;border-right:2px solid #1B1B1B;border-bottom:2px solid #1B1B1B;display:flex;align-items:center;gap:12px;font:500 16px/1.25 Jost,sans-serif\"><span style=\"flex:none;width:12px;height:12px;background:#D63A2F\"><\u002Fspan>known false positives<\u002Fdiv>\n<div style=\"padding:16px 18px;border-bottom:2px solid #1B1B1B;display:flex;align-items:center;gap:12px;font:500 16px/1.25 Jost,sans-serif\"><span style=\"flex:none;width:12px;height:12px;border-radius:50%;background:#2452A6\"><\u002Fspan>successful counterexamples<\u002Fdiv>\n<div style=\"padding:16px 18px;border-right:2px solid #1B1B1B;display:flex;align-items:center;gap:12px;font:500 16px/1.25 Jost,sans-serif\"><span style=\"flex:none;width:14px;height:12px;background:#F0B323;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan>a risk level<\u002Fdiv>\n<div style=\"padding:16px 18px;display:flex;align-items:center;gap:12px;font:500 16px/1.25 Jost,sans-serif\"><span style=\"flex:none;width:12px;height:12px;border:2px solid #1B1B1B;box-sizing:border-box\"><\u002Fspan>limits on what it is allowed to change<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:48px;border-top:3px solid #1B1B1B;padding-top:28px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;align-items:start\">\n<div><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955\">a rule cannot simply say<\u002Fdiv><div style=\"margin-top:14px;font:700 34px/1.1 Jost,sans-serif;letter-spacing:-.02em;color:#5b5955;text-decoration:line-through;text-decoration-color:#D63A2F;text-decoration-thickness:4px\">avoid repetition.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\">it has to know the difference between<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n<span style=\"display:inline-flex;align-items:center;gap:8px;border:2px solid #1B1B1B;border-radius:999px;padding:8px 14px;font:500 15px/1 Jost,sans-serif\"><span style=\"width:10px;height:10px;background:#D63A2F\"><\u002Fspan>useless repetition<\u002Fspan>\n<span style=\"font:500 15px/1 Jost,sans-serif;padding:0 4px\">and<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:8px;border:2px solid #1B1B1B;border-radius:999px;padding:8px 14px;font:500 15px/1 Jost,sans-serif\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>a refrain<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:8px;border:2px solid #1B1B1B;border-radius:999px;padding:8px 14px;font:500 15px/1 Jost,sans-serif\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>a rhythm<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:8px;border:2px solid #1B1B1B;border-radius:999px;padding:8px 14px;font:500 15px/1 Jost,sans-serif\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>a legal requirement<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:8px;border:2px solid #1B1B1B;border-radius:999px;padding:8px 14px;font:500 15px/1 Jost,sans-serif\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>a technical term<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:8px;border:2px solid #1B1B1B;border-radius:999px;padding:8px 14px;font:500 15px/1 Jost,sans-serif\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>deliberate emotional insistence<\u002Fspan>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px\">\n<div style=\"border-top:3px solid #1B1B1B;padding-top:14px;font:600 19px/1.3 Jost,sans-serif\">the rules can be tested.<\u002Fdiv>\n<div style=\"border-top:3px solid #1B1B1B;padding-top:14px;font:600 19px/1.3 Jost,sans-serif\">they can be challenged.<\u002Fdiv>\n<div style=\"border-top:3px solid #1B1B1B;padding-top:14px;font:600 19px/1.3 Jost,sans-serif\">they can be changed without silently changing the whole system.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"13 The test corpus\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">13<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">the test corpus<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">it has a test system<br>built before the editor.<\u002Fh2>\n<div style=\"display:flex;gap:24px;align-items:flex-start;margin-bottom:44px;flex-wrap:wrap\">\n<p style=\"margin:0;max-width:620px;font:400 19px/1.5 Jost,sans-serif\">This may be the biggest technical difference. We are not building the editor first and then asking whether it seems smart. We are building the test system before the final editorial intelligence.<\u002Fp>\n<span style=\"display:inline-flex;align-items:center;gap:8px;border:2px solid #1B1B1B;border-radius:999px;padding:5px 12px;font:500 11px/1 Jost,sans-serif;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;margin-top:6px\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B323\"><\u002Fspan>growing gold-standard corpus<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px\">it already contains cases such as<\u002Fdiv>\n<div style=\"border:3px solid #1B1B1B\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:3px solid #1B1B1B;font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\"><div style=\"padding:14px 22px;border-right:3px solid #1B1B1B;display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#2452A6\"><\u002Fspan>good writing it must leave alone<\u002Fdiv><div style=\"padding:14px 22px;display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;background:#D63A2F\"><\u002Fspan>real problems it must catch<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:2px solid #1B1B1B\"><div style=\"padding:18px 22px;border-right:3px solid #1B1B1B;font:500 17px/1.4 Jost,sans-serif\">Repetition that is necessary<\u002Fdiv><div style=\"padding:18px 22px;font:500 17px/1.4 Jost,sans-serif\">Repetition that is wasteful<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:2px solid #1B1B1B\"><div style=\"padding:18px 22px;border-right:3px solid #1B1B1B;font:500 17px/1.4 Jost,sans-serif\">Productive ambiguity that must survive<\u002Fdiv><div style=\"padding:18px 22px;font:500 17px/1.4 Jost,sans-serif\">False precision that must be corrected<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:2px solid #1B1B1B\"><div style=\"padding:18px 22px;border-right:3px solid #1B1B1B;font:500 17px/1.4 Jost,sans-serif\">Strong anger that is justified<\u002Fdiv><div style=\"padding:18px 22px;font:500 17px/1.4 Jost,sans-serif\">Strong anger that outruns the evidence<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:2px solid #1B1B1B\"><div style=\"padding:18px 22px;border-right:3px solid #1B1B1B;font:500 17px/1.4 Jost,sans-serif\">Associative prose that is coherent<\u002Fdiv><div style=\"padding:18px 22px;font:500 17px/1.4 Jost,sans-serif\">Associative prose that has lost the thread<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:2px solid #1B1B1B\"><div style=\"padding:18px 22px;border-right:3px solid #1B1B1B;font:500 17px/1.4 Jost,sans-serif\">A long sentence that must not be shortened<\u002Fdiv><div style=\"padding:18px 22px;font:500 17px/1.4 Jost,sans-serif\">A local sentence that works but becomes annoying when repeated across a document<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)\"><div style=\"padding:18px 22px;border-right:3px solid #1B1B1B;font:500 17px/1.4 Jost,sans-serif\">A passive sentence that should stay passive<\u002Fdiv><div style=\"padding:18px 22px;font:500 17px/1.4 Jost,sans-serif\">A revision that fixes one problem and creates a worse one<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:40px;background:#1B1B1B;color:#F3F0E8;padding:30px 36px;font:600 26px/1.25 Jost,sans-serif;letter-spacing:-.01em\">the system is tested not only on whether it finds problems.<br><span style=\"color:#F0B323\">it is tested on whether it leaves good writing alone.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"14 The difference\" style=\"padding:72px 112px 80px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#1B1B1B;color:#F3F0E8;display:flex;align-items:center;justify-content:center;font:600 13px/1 Jost,sans-serif\">14<\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">the difference<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 18px;font:700 64px/1.02 Jost,sans-serif;letter-spacing:-.03em\">that changes what<br>“better AI editing” means.<\u002Fh2>\n<p style=\"margin:0 0 44px;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">Ernest-Faulkner takes a different path from the one AI writing tools have followed. It tries to build better editorial judgment. That is a much harder problem.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px 24px;align-items:center\">\n<div style=\"font:500 11px/1.3 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955\">the normal path<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<div style=\"flex:1;border:3px solid #1B1B1B;padding:16px 18px;font:500 17px/1.25 Jost,sans-serif\">better generation<\u002Fdiv>\n<svg width=\"26\" height=\"14\" style=\"flex:none\"><path d=\"M0 7 H16\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M14 1 L25 7 L14 13 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg>\n<div style=\"flex:1;border:3px solid #1B1B1B;padding:16px 18px;font:500 17px/1.25 Jost,sans-serif\">better rewriting<\u002Fdiv>\n<svg width=\"26\" height=\"14\" style=\"flex:none\"><path d=\"M0 7 H16\" style=\"fill:none;stroke:#1B1B1B;stroke-width:3px\"><\u002Fpath><path d=\"M14 1 L25 7 L14 13 Z\" style=\"fill:#1B1B1B\"><\u002Fpath><\u002Fsvg>\n<div style=\"flex:1.4;border:3px solid #1B1B1B;padding:16px 18px;font:500 17px/1.25 Jost,sans-serif\">better imitation of a human editor<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;font:500 11px/1.3 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase\"><span style=\"flex:none;width:14px;height:12px;background:#1B1B1B;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan>ernest-faulkner<\u002Fdiv>\n<div style=\"background:#F0B323;padding:20px 22px;font:700 30px/1.1 Jost,sans-serif;letter-spacing:-.02em\">better editorial judgment.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px solid #1B1B1B;border-left:3px solid #1B1B1B\">\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 22px 26px\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:12px\">a co-writer asks<\u002Fdiv><div style=\"font:600 22px/1.25 Jost,sans-serif\">What should we write?<\u002Fdiv><\u002Fdiv>\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 22px 26px\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:12px\">a rewriting tool asks<\u002Fdiv><div style=\"font:600 22px/1.25 Jost,sans-serif\">How can I make this sound better?<\u002Fdiv><\u002Fdiv>\n<div style=\"border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;padding:24px 22px 26px\"><div style=\"font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5b5955;margin-bottom:12px\">a grammar tool asks<\u002Fdiv><div style=\"font:600 22px/1.25 Jost,sans-serif\">Does this follow standard rules?<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column:1 / -1;border-right:3px solid #1B1B1B;border-bottom:3px solid #1B1B1B;background:#1B1B1B;color:#F3F0E8;padding:30px 32px 34px;display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\"><span style=\"width:44px;height:38px;background:#F0B323;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan><span style=\"font:500 11px/1.3 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#F0B323\">ernest-faulkner asks<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;font:500 22px/1.3 Jost,sans-serif\">\n<div>What is this passage trying to accomplish?<\u002Fdiv>\n<div>What does this choice cost?<\u002Fdiv>\n<div>What does it gain?<\u002Fdiv>\n<div>Is the tradeoff working?<\u002Fdiv>\n<div style=\"margin-top:10px;font:700 34px/1.12 Jost,sans-serif;letter-spacing:-.02em;color:#F0B323\">And have I earned the right to interfere?<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:28px 0 0;max-width:700px;font:400 17px/1.5 Jost,sans-serif\">That last question is what makes the engine fundamentally different.<\u002Fp>\n<\u002Fdiv>\n\n<div data-screen-label=\"Closing\" style=\"background:#F0B323;color:#1B1B1B;padding:88px 112px 96px;border-top:8px solid #1B1B1B\">\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:36px\"><span style=\"width:30px;height:26px;background:#1B1B1B;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase\">the burden of proof<\u002Fspan><\u002Fdiv>\n<div style=\"font:700 52px/1.06 Jost,sans-serif;letter-spacing:-.035em;max-width:856px\">the writer does not have to prove that a strange sentence deserves to survive.<\u002Fdiv>\n<div style=\"margin-top:32px;background:#1B1B1B;color:#F3F0E8;padding:28px 32px 32px;font:700 44px/1.08 Jost,sans-serif;letter-spacing:-.03em\">the editor has to prove that changing it is justified.<\u002Fdiv>\n<p style=\"margin:36px 0 0;max-width:700px;font:400 19px/1.5 Jost,sans-serif\">That is the Ernest-Faulkner Engine. Not AI writing and editing — editorial judgment, from a machine with a human editor’s mindset.<\u002Fp>\n<div style=\"margin-top:56px;display:flex;align-items:center;gap:24px\"><div style=\"width:56px;height:56px;border-radius:50%;background:#2452A6\"><\u002Fdiv><div style=\"width:60px;height:52px;background:#D63A2F;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fdiv><div style=\"width:52px;height:52px;background:#1B1B1B\"><\u002Fdiv><div style=\"flex:1;height:4px;background:#1B1B1B\"><\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:36px;font:600 34px/1.2 Jost,sans-serif;letter-spacing:-.02em;max-width:900px\">AI can rewrite a sentence. ernest-faulkner decides when and how.<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"Footer\" style=\"background:#1B1B1B;color:#F3F0E8;padding:36px 112px 40px;display:flex;flex-direction:column;gap:22px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:32px\">\n<div style=\"display:flex;align-items:center;gap:14px;white-space:nowrap\">\n<svg width=\"34\" height=\"24\"><path d=\"M4 22 L17 3 L30 22\" style=\"fill:none;stroke:#F3F0E8;stroke-width:6px\"><\u002Fpath><\u002Fsvg>\n<span style=\"font:600 15px/1 Jost,sans-serif;letter-spacing:.42em\">ATMA<\u002Fspan>\n<span style=\"margin-left:8px;font:500 10px/1 Jost,sans-serif;letter-spacing:.24em;color:#a9a59b\">MARKETER · AUTHOR · SYSTEMS ENGINEER<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:28px;white-space:nowrap\"><a href=\"/ai-brain\" style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.12em;color:#F3F0E8;text-decoration:none\" style-hover=\"color:#F0B323\">← atmaOS<\u002Fa><span style=\"font:500 13px/1 Jost,sans-serif;letter-spacing:.12em\">atma.marketing<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:2px solid #5b5955;padding-top:18px;font:400 13px/1.5 Jost,sans-serif;color:#a9a59b;max-width:720px\">Ernest-Faulkner is in development. The figures describe the engine’s design and its first evaluation corpus, not audited results.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;fitToWidth&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;imageTreatment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;original&quot;,&quot;duotone&quot;,&quot;mono&quot;],&quot;default&quot;:&quot;original&quot;,&quot;tsType&quot;:&quot;'original' | 'duotone' | 'mono'&quot;,&quot;section&quot;:&quot;Hero image&quot;}}\">\nclass Component extends DCLogic {\n  state = { vw: typeof window !== 'undefined' ? window.innerWidth : 1080 };\n  componentDidMount() {\n    this._onResize = () => this.setState({ vw: window.innerWidth });\n    window.addEventListener('resize', this._onResize);\n    this._onResize();\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }\n  renderVals() {\n    const fit = this.props.fitToWidth ?? true;\n    const zoom = fit ? Math.min(1, Math.max(0.3, this.state.vw / 1080)) : 1;\n    const t = this.props.imageTreatment ?? 'original';\n    return {\n      zoom: Number(zoom.toFixed(4)),\n      imgOriginal: t === 'original',\n      imgMono: t === 'mono',\n      imgDuotone: t === 'duotone'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
