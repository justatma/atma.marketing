ound-position: 0 -240px; } }\n  @keyframes nmp-reticle { 0%,100% { opacity: .55; } 50% { opacity: .95; } }\n  @keyframes nmp-wallscroll { from { transform: translateY(0); } to { transform: translateY(-50%); } }\n  @keyframes nmp-lockpulse { 0%,100% { box-shadow: 0 0 0 1px var(--signal), 0 0 14px rgba(47,224,196,.5) inset; } 50% { box-shadow: 0 0 0 1px var(--signal), 0 0 26px rgba(47,224,196,.8) inset; } }\n  @keyframes nmp-silscan { 0% { transform: translateY(-12px); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(96px); opacity: 0; } }\n  @keyframes nmp-meshflick { 0%,100% { opacity: .25; } 50% { opacity: .7; } }\n  @keyframes nmp-titleflick { 0%,100%{opacity:1;} 10%{opacity:.2;} 12%{opacity:1;} 40%{opacity:.6;} 42%{opacity:1;} 70%{opacity:.3;} 72%{opacity:1;} }\n  @keyframes nmp-glitch {\n    0%, 82%, 100% { transform: translate(0,0); filter: none; }\n    84% { transform: translate(-2px,1px); filter: drop-shadow(2px 0 rgba(255,77,61,.9)) drop-shadow(-2px 0 rgba(47,224,196,.9)); }\n    87% { transform: translate(2px,-1px); filter: drop-shadow(-2px 0 rgba(143,123,214,.9)) drop-shadow(2px 0 rgba(47,224,196,.9)); }\n    90% { transform: translate(-1px,0); }\n    93% { transform: translate(1px,1px); filter: none; }\n  }\n  /* reduced motion: neutralise heavy loops, keep end states */\n  [data-reduced=\"1\"] *, [data-reduced=\"1\"] *::before, [data-reduced=\"1\"] *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .12s !important; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div ref=\"{{ rootRef }}\" style=\"position: relative; min-height: 100vh; background: #03050a; color: #8aa39b; font-family: 'JetBrains Mono', monospace; overflow-x: hidden; --signal: #2fe0c4; --violet: #8f7bd6; --blue: #3f7fae; --alert: #ff4d3d; --ink: #cfe1dc;\">\n\n  <!-- ===== LIVING DATA WALL (intensity fades to signal) ===== -->\n  <div style=\"position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: #03050a;\">\n    <div ref=\"{{ wallRef }}\" style=\"position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) perspective(1500px) rotateX(7deg) scale(1.22); transform-origin: 50% 38%; display: grid; gap: 9px; opacity: var(--wall, 0.7); filter: blur(0.3px) saturate(0.7); -webkit-mask-image: radial-gradient(ellipse 60% 52% at 50% 42%, transparent 10%, rgba(0,0,0,0.55) 48%, #000 78%); mask-image: radial-gradient(ellipse 60% 52% at 50% 42%, transparent 10%, rgba(0,0,0,0.55) 48%, #000 78%);\"><\u002Fdiv>\n    <div style=\"position: absolute; inset: 0; background: radial-gradient(ellipse 50% 44% at 50% 40%, transparent 30%, rgba(3,5,10,0.5) 70%, rgba(3,5,10,0.94) 100%);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <!-- atmosphere -->\n  <div style=\"position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;\">\n    <div data-af=\"\" style=\"position: absolute; inset: -12%; opacity: var(--haze, 0.6);\">\n      <div style=\"position: absolute; top: -15%; left: -12%; width: 62%; height: 70%; background: radial-gradient(ellipse at center, rgba(31,140,120,0.15), transparent 64%); filter: blur(52px); animation: nmp-haze 28s ease-in-out infinite;\"><\u002Fdiv>\n      <div style=\"position: absolute; bottom: -24%; right: -14%; width: 58%; height: 70%; background: radial-gradient(ellipse at center, rgba(40,90,150,0.12), transparent 62%); filter: blur(58px); animation: nmp-haze 34s ease-in-out infinite reverse;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position: fixed; inset: 0; z-index: 40; pointer-events: none; mix-blend-mode: overlay; opacity: var(--scan, 0.4); background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.6) 3px, rgba(0,0,0,0) 4px); animation: nmp-scanmove 8s linear infinite;\"><\u002Fdiv>\n  <div ref=\"{{ trackRef }}\" style=\"position: fixed; left: 0; right: 0; top: 0; height: 96px; z-index: 42; pointer-events: none; opacity: var(--track, 0.4); mix-blend-mo u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity: 0; transform: translateY(16px); transition: opacity .8s ease, transform .8s ease;\">\n        <div style=\"font-size: clamp(15px,2.1vw,20px); line-height: 1.55; color: var(--ink); max-width: 760px;\">The problem is not marketing options.<\u002Fdiv>\n        <div style=\"margin-top: 14px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: clamp(1.3rem,3vw,2.2rem); line-height: 1.05; color: var(--signal); text-transform: uppercase; max-width: 18ch;\">It is the inability to tell which evidence deserves <span data-scan=\"\">scale.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity: 0; transform: translateY(16px); transition: opacity .8s ease; margin-top: 36px; font-size: clamp(14px,1.7vw,17px); color: #93aaa3;\">Most companies respond by jumping from tactic to tactic.<\u002Fdiv>\n      <div ref=\"{{ moreStackRef }}\"><\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity: 0; transform: translateY(16px); transition: opacity .8s ease; margin-top: 28px; font-size: clamp(15px,2vw,19px); color: var(--ink);\">They try to force growth on the noise.<\u002Fdiv>\n      <div ref=\"{{ freezeRef }}\" data-reveal=\"\" style=\"opacity: 0; transform: translateY(16px); transition: opacity .8s ease; margin-top: 14px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: clamp(1.5rem,3.6vw,2.7rem); text-transform: uppercase; color: var(--alert); letter-spacing: 0.02em;\">Then call the results <span data-scan=\"\">learning.<\u002Fspan><\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 05 · NEW MARKET PHYSICS (framework / questions) -->\n    <section data-panel=\"\" data-title=\"05 · THE NEW MARKET PHYSICS\" id=\"framework\" data-zone=\"transition\" data-screen-label=\"05 Framework\" style=\"max-width: 1040px; margin: 0 auto; padding: clamp(80px,13vh,150px) 26px;\">\n      <div style=\"font-size: 10.5px; letter-spacing: 0.3em; color: var(--violet); margin-bottom: 30px;\">05 / THE NEW MARKET PHYSICS<\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity: 0; transform: translateY(16px); transition: opacity .8s ease, transform .8s ease; font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: clamp(1.4rem, 3vw, 2.3rem); line-height: 1.14; color: var(--ink); max-width: 26ch;\">The New Market Physics is a science-based discipline for discovering the <span data-scan=\"\" style=\"color: var(--signal);\">right audience<\u002Fspan> while there is runway to scale them.<\u002Fdiv>\n      <p data-reveal=\"\" style=\"opacity: 0; transition: opacity .8s ease .05s; margin: 22px 0 0; font-size: clamp(13px,1.6vw,16px); line-height: 1.65; color: #93aaa3; max-width: 620px;\">It is driven by exposing, proving, or disbanding assumptions based on:<\u002Fp>\n      <div data-reveal=\"\" style=\"opacity: 0; transition: opacity .8s ease .1s; margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: rgba(47,224,196,0.12); border: 1px solid rgba(47,224,196,0.12);\">\n        <div class=\"nmp-q\"><span class=\"nmp-qn\">Q1<\u002Fspan>Who wants this?<\u002Fdiv>\n        <div class=\"nmp-q\"><span class=\"nmp-qn\">Q2<\u002Fspan>Why do they want it?<\u002Fdiv>\n        <div class=\"nmp-q\"><span class=\"nmp-qn\">Q3<\u002Fspan>What do they believe they are buying?<\u002Fdiv>\n        <div class=\"nmp-q\"><span class=\"nmp-qn\">Q4<\u002Fspan>Which story moves them?<\u002Fdiv>\n        <div class=\"nmp-q\"><span class=\"nmp-qn\">Q5<\u002Fspan>What’s holding their attention?<\u002Fdiv>\n        <div class=\"nmp-q\"><span class=\"nmp-qn\">Q6<\u002Fspan>What audience is ready to scale?<\u002Fdiv>\n        <div class=\"nmp-q\" style=\"color: var(--alert);\"><span class=\"nmp-qn\" style=\"color: var(--alert);\">Q7<\u002Fspan>What efforts should die now?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 06 · THE METHOD -->\n    <section data-panel=\"\" data-title=\"06 · THE METHOD\" id=\"method\" data-zone=\"transition\" data-screen-label=\"06 The Method\" style=\"max-width: 1000px; margin: 0 auto; padding: clamp(70px,12vh,140px) 26px;\">\n      <div style=\"font-size: 10.5px; letter-spacing: 0.3em; color: var(--violet); margin-bottom: 32px;\">06 / THE METHOD<\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity: 0; transform: translateY(16px); transition: opacity .8s ease, transform .8s ease; display: flex; flex-direction: column; gap: 20px; font-size: clamp(15px,2vw,20px); line-height: 1.55; color: var(--ink); max-width: 760px;\">\n        <p style=\"margin: 0; color: #93aaa3;\">Moving beyond mere best practices:<\u002Fp>\n        <p style=\"margin: 0;\">A connected system of <span data-scan=\"\" style=\"color: var(--signal);\">behavioral research<\u002Fspan>, <span data-scan=\"\" style=\"color: var(--signal);\">controlled field experiments<\u002Fspan>, <span data-scan=\"\" style=\"color: var(--signal);\">Bayesian inference<\u002Fspan>, <span data-scan=\"\" style=\"color: var(--signal);\">narrative analysis<\u002Fspan>, <span data-scan=\"\" style=\"color: var(--signal);\">identity resolution<\u002Fspan>, <span data-scan=\"\" style=\"color: var(--signal);\">machine learning<\u002Fspan> and <span data-scan=\"\" style=\"color: var(--signal);\">code.<\u002Fspan><\u002Fp>\n        <p style=\"margin: 0; color: #93aaa3;\">Each component answers a different question.<\u002Fp>\n        <p style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: clamp(1.3rem,2.8vw,2rem); text-transform: uppercase; color: var(--ink);\">Together, they separate <span style=\"color: var(--signal);\">signal<\u002Fspan> from <span style=\"color: var(--alert);\">noise.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 07 · THE MACHINERY (accordion) -->\n    <section data-panel=\"\" data-title=\"07 · THE MACHINERY\" id=\"machinery\" data-zone=\"transition\" data-screen-label=\"07 The Machinery\" style=\"max-width: 1040px; margin: 0 auto; padding: clamp(70px,12vh,140px) 26px;\">\n      <div style=\"font-size: 10.5px; letter-spacing: 0.3em; color: var(--violet); margin-bottom: 30px;\">07 / THE MACHINERY<\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity: 0; transition: opacity .8s ease; display: flex; flex-direction: column; gap: 10px;\">\n        <div class=\"nmp-mod\" data-mod=\"\">\n          <div class=\"nmp-modhead\" data-mod-head=\"\"><span class=\"nmp-modn\">07.1<\u002Fspan><h3 class=\"nmp-modtitle\">Assumption Annihilator<\u002Fh3><span class=\"nmp-chev\">+<\u002Fspan><\u002Fdiv>\n          <div class=\"nmp-modbody\"><div class=\"nmp-modinner\"><p>Identify the beliefs that could kill the company.<\u002Fp><p>Define what would prove them wrong.<\u002Fp><p>Test them before they become a strategy or a cancer.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"nmp-mod\" data-mod=\"\">\n          <div class=\"nmp-modhead\" data-mod-head=\"\"><span class=\"nmp-modn\">07.2<\u002Fspan><h3 class=\"nmp-modtitle\">Ethnographic Interviews<\u002Fh3><span class=\"nmp-chev\">+<\u002Fspan><\u002Fdiv>\n          <div class=\"nmp-modbody\"><div class=\"nmp-modinner\"><p>People are unreliable narrators of their own behavior.<\u002Fp><p>I use a proprietary system for extracting the unconscious drivers.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"nmp-mod\" data-mod=\"\">\n          <div class=\"nmp-modhead\" data-mod-head=\"\"><span class=\"nmp-modn\">07.3<\u002Fspan><h3 class=\"nmp-modtitle\">Bayesian Marketing<\u002Fh3><span class=\"nmp-chev\">+<\u002Fspan><\u002Fdiv>\n          <div class=\"nmp-modbody\"><div class=\"nmp-modinner\"><p>Do not wait for certainty that will arrive after the money is gone.<\u002Fp><p>Update the probability as evidence arrives.<\u002Fp><p>My Bayesian ad-data analysis engine tracks early evidence.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"nmp-mod\" data-mod=\"\">\n          <div class=\"nmp-modhead\" data-mod-head=\"\"><span class=\"nmp-modn\">07.4<\u002Fspan><h3 class=\"nmp-modtitle\">Identity Resolution<\u002Fh3><span class=\"nmp-chev\">+<\u002Fspan><\u002Fdiv>\n          <div class=\"nmp-modbody\"><div class=\"nmp-modinner\"><p>Anonymous traffic is not a market.<\u002Fp><p>It is a collection of people and accounts leaving different traces of intent.<\u002Fp><p>Resolve the accounts and the people inside them.<\u002Fp><p>Match the message to the motive.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"nmp-mod\" data-mod=\"\">\n          <div class=\"nmp-modhead\" data-mod-head=\"\"><span class=\"nmp-modn\">07.5<\u002Fspan><h3 class=\"nmp-modtitle\">Machine Learning + AI<\u002Fh3><span class=\"nmp-chev\">+<\u002Fspan><\u002Fdiv>\n          <div class=\"nmp-modbody\"><div class=\"nmp-modinner\"><p>How I discover the narrative hiding in the data.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"nmp-mod\" data-mod=\"\">\n          <div class=\"nmp-modhead\" data-mod-head=\"\"><span class=\"nmp-modn\">07.6<\u002Fspan><h3 class=\"nmp-modtitle\">ABM Reinvented — AI + Modern Psychology<\u002Fh3><span class=\"nmp-chev\">+<\u002Fspan><\u002Fdiv>\n          <div class=\"nmp-modbody\"><div class=\"nmp-modinner\"><p>An AI psychodynamic ABM pipeline — hardcore lead-gen via ML / narrative / semantic profiling.<\u002Fp><p style=\"color: var(--violet);\">Patent Pending.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 08 · THE PATTERN (clinically still) -->\n    <section data-panel=\"\" data-title=\"08 · THE PATTERN\" id=\"pattern\" data-zone=\"signal\" data-screen-label=\"08 The Pattern\" style=\"max-width: 980px; margin: 0 auto; padding: clamp(90px,15vh,180px) 26px;\">\n      <div style=\"font-size: 10.5px; letter-spacing: 0.3em; color: #5f7a73; margin-bottom: 44px;\">08 / THE PATTERN<\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity: 0; transition: opacity 1s ease; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: clamp(1.5rem, 3.6vw, 2.8rem); line-height: 1.04; color: var(--ink); text-transform: uppercase;\">The market doesn’t care what you think.<\u002Fdiv>\n      <p data-reveal=\"\" style=\"opacity: 0; transition: opacity 1s ease .1s; margin: 32px 0 0; font-size: clamp(15px,2vw,19px); line-height: 1.7; color: #aebfb9; max-width: 700px;\">It rewards the founders willing to be <span data-scan=\"\" style=\"color: var(--signal);\">corrected.<\u002Fspan><\u002Fp>\n      <p data-reveal=\"\" style=\"opacity: 0; transition: opacity 1s ease .2s; margin: 22px 0 0; font-size: clamp(15px,2vw,19px); line-height: 1.7; color: #aebfb9; max-width: 700px;\">In my case studies, every founder began with a theory. Success came when the theory was allowed to change.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- 09 · MARKET CORRECTIONS -->\n    <section data-panel=\"\" data-title=\"09 · MARKET CORRECTIONS\" id=\"corrections\" data-zone=\"signal\" data-screen-label=\"09 Market Corrections\" style=\"max-width: 1100px; margin: 0 auto; padding: clamp(40px,7vh,90px) 26px clamp(70px,12vh,140px);\">\n      <div style=\"font-size: 10.5px; letter-spacing: 0.3em; color: #5f7a73; margin-bottom: 14px;\">09 / MARKET CORRECTIONS<\u002Fdiv>\n      <div style=\"font-size: 11px; letter-spacing: 0.16em; color: #46607a; margin-bottom: 40px;\">SCHEMA · CONDITION → CORRECTION → ACTION → RESULT<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n\n        <article class=\"nmp-case\" data-reveal=\"\" style=\"opacity: 0; transition: opacity .9s ease;\">\n          <div class=\"nmp-casehead\"><span>MARKET CORRECTION: use case_01<\u002Fspan><span class=\"nmp-sector\">PREMIUM CHOCOLATE<\u002Fspan><\u002Fdiv>\n          <div class=\"nmp-casetitle\">Zero to a Million — a premium chocolate success<\u002Fdiv>\n          <div class=\"nmp-casegrid\">\n            <div class=\"nmp-cell\"><div class=\"nmp-cellk\">ORIGINAL CONDITION<\u002Fdiv><p>High-end food ecommerce is brutally difficult without recognition.<\u002Fp><p>The founder had failed before. The agency still had not launched.<\u002Fp><\u002Fdiv>\n            <div class=\"nmp-cell\"><div class=\"nmp-cellk\">CORRECTION + ACTION<\u002Fdiv><p>She fired the agency. I launched the company in less than a week.<\u002Fp><p>No ninety-day plan. Just disciplined iterative loops with clear kill-versus-scale criteria.<\u002Fp><\u002Fdiv>\n            <div class=\"nmp-cell\"><div class=\"nmp-cellk\" style=\"color: var(--signal);\">FOUNDER RESPONSE<\u002Fdiv><p style=\"color: var(--signal); font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.01em;\">She followed the evidence.<\u002Fp><\u002Fdiv>\n            <div class=\"nmp-cell\"><div class=\"nmp-cellk\" style=\"color: var(--signal);\">RESULT<\u002Fdiv><p style=\"color: var(--ink);\">The company went from launch to a <span data-scan=\"\" style=\"color: var(--signal);\">$1.8 million<\u002Fspan> Annual Revenue Run rate in under 16 months.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"nmp-artifact\">ARTIFACT · REVENUE RUN-RATE CURVE — AWAITING DECLASSIFICATION<\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"nmp-case\" data-reveal=\"\" style=\"opacity: 0; transition: opacity .9s ease;\">\n          <div class=\"nmp-casehead\"><span>MARKET CORRECTION: use case_02<\u002Fspan><span class=\"nmp-sector\">ENTERPRISE MACHINE LEARNING<\u002Fspan><\u002Fdiv>\n          <div class=\"nmp-casetitle\">Machine Learning for the Fortune 100<\u002Fdiv>\n          <div class=\"nmp-casegrid\">\n            <div class=\"nmp-cell\"><div class=\"nmp-cellk\">BELIEF<\u002Fdiv><p>The company thought it had a product-management problem.<\u002Fp><\u002Fdiv>\n            <div class=\"nmp-cell\"><div class=\"nmp-cellk\">CORRECTION + ACTION<\u002Fdiv><p>I assessed the business and found a different failure point.<\u002Fp><p>The evidence pointed to an account-based marketing problem. I built the system they actually needed.<\u002Fp><\u002Fdiv>\n            <div class=\"nmp-cell\" style=\"grid-column: 1 / -1;\"><div class=\"nmp-cellk\" style=\"color: var(--signal);\">RESULT<\u002Fdiv><p style=\"color: var(--ink);\">The company stopped trying to solve the wrong problem, and kept growing.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"nmp-artifact\">ARTIFACT · REDACTED ABM ARCHITECTURE — AWAITING DECLASSIFICATION<\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"nmp-case\" data-reveal=\"\" style=\"opacity: 0; transition: opacity .9s ease;\">\n          <div class=\"nmp-casehead\"><span>MARKET CORRECTION: use case_03<\u002Fspan><span class=\"nmp-sector\">DEVELOPER INFRASTRUCTURE<\u002Fspan><\u002Fdiv>\n          <div class=\"nmp-casetitle\">A New Codebase With No Parallel<\u002Fdiv>\n          <div class=\"nmp-casegrid\">\n            <div class=\"nmp-cell\"><div class=\"nmp-cellk\">ORIGINAL CONDITION<\u002Fdiv><p>The founder had created an entirely new codebase for backend-driven websites.<\u002Fp><p>Technical originality was not the problem.<\u002Fp><\u002Fdiv>\n            <div class=\"nmp-cell\"><div class=\"nmp-cellk\">CORRECTION + ACTION<\u002Fdiv><p>The market needed a commercial argument it could understand and fund.<\u002Fp><p>I rebuilt the argument.<\u002Fp><\u002Fdiv>\n            <div class=\"nmp-cell\" style=\"grid-column: 1 / -1;\"><div class=\"nmp-cellk\" style=\"color: var(--signal);\">RESULT<\u002Fdiv><p style=\"color: var(--ink);\">He raised his first substantial round.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"nmp-artifact\">ARTIFACT · NARRATIVE / DECK COMPARISON — AWAITING DECLASSIFICATION<\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"nmp-case\" data-reveal=\"\" style=\"opacity: 0; transition: opacity .9s ease;\">\n          <div class=\"nmp-casehead\"><span>MARKET CORRECTION: use case_04<\u002Fspan><span class=\"nmp-sector\">HIGH-END YOGA APPAREL<\u002Fspan><\u002Fdiv>\n          <div class=\"nmp-casetitle\">High-End Yoga Apparel Takes a Dive<\u002Fdiv>\n          <div class=\"nmp-casegrid\">\n            <div class=\"nmp-cell\"><div class=\"nmp-cellk\">ORIGINAL CONDITION<\u002Fdiv><p>The growth line had reversed and plummeted.<\u002Fp><\u002Fdiv>\n            <div class=\"nmp-cell\"><div class=\"nmp-cellk\">CORRECTION + ACTION<\u002Fdiv><p>I found an underserved fan base the brand had not learned to activate.<\u002Fp><p>We built engagement mechanics around that signal and tied them to an iterative evidence-based ad system.<\u002Fp><\u002Fdiv>\n            <div class=\"nmp-cell\" style=\"grid-column: 1 / -1;\"><div class=\"nmp-cellk\" style=\"color: var(--signal);\">RESULT<\u002Fdiv><p style=\"color: var(--ink);\">The growth curve reversed again and surpassed previous sales within <span data-scan=\"\" style=\"color: var(--signal);\">45 days.<\u002Fspan> The business continues to thrive.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"nmp-artifact\">ARTIFACT · INDEXED SALES CURVE — AWAITING DECLASSIFICATION<\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 10 · NEGATIVE EVIDENCE -->\n    <section data-panel=\"\" data-title=\"10 · NEGATIVE EVIDENCE\" id=\"negative\" data-zone=\"signal\" data-screen-label=\"10 Negative Evidence\" style=\"max-width: 1000px; margin: 0 auto; padding: clamp(70px,12vh,140px) 26px;\">\n      <div style=\"font-size: 10.5px; letter-spacing: 0.3em; color: #5f7a73; margin-bottom: 36px;\">10 / NEGATIVE EVIDENCE<\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity: 0; transition: opacity .9s ease; font-size: clamp(15px,2vw,19px); color: var(--ink); margin-bottom: 28px;\">The failures followed the same pattern in reverse.<\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity: 0; transition: opacity .9s ease .05s; display: flex; flex-direction: column; gap: 9px; max-width: 820px;\">\n        <div class=\"nmp-fail\"><span>The wrong audience was pursued.<\u002Fspan><span class=\"nmp-status\">PURSUED<\u002Fspan><\u002Fdiv>\n        <div class=\"nmp-fail\"><span>Established startups’ campaigns were imitated.<\u002Fspan><span class=\"nmp-status\">IMITATED<\u002Fspan><\u002Fdiv>\n        <div class=\"nmp-fail\"><span>Founders followed their intuition.<\u002Fspan><span class=\"nmp-status\">INTUITION<\u002Fspan><\u002Fdiv>\n        <div class=\"nmp-fail\"><span>New ideas were constantly tried with no testing discipline and no falsifiable data.<\u002Fspan><span class=\"nmp-status\">UNFALSIFIABLE<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity: 0; transition: opacity .9s ease .1s; margin-top: 30px; display: flex; flex-direction: column; gap: 14px; font-size: clamp(14px,1.8vw,18px); line-height: 1.6; color: #93aaa3; max-width: 760px;\">\n        <p style=\"margin: 0;\">Evidence-based frames were offered.<\u002Fp>\n        <p style=\"margin: 0; color: var(--alert); font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: clamp(1.4rem,3.2vw,2.2rem); text-transform: uppercase;\">Conviction overruled them.<\u002Fp>\n        <p style=\"margin: 8px 0 0; color: var(--ink);\">I will not name those companies. Their failures are not trophies.<\u002Fp>\n        <p style=\"margin: 0; color: #93aaa3;\">The pattern repeats; that is enough.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 11 · THE RULE (remembered sentence, near-empty) -->\n    <section data-panel=\"\" data-title=\"11 · THE RULE\" id=\"rule\" data-zone=\"signal-quiet\" data-screen-label=\"11 The Rule\" style=\"min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 1080px; margin: 0 auto; padding: clamp(90px,16vh,200px) clamp(40px,7vw,128px);\">\n      <p data-reveal=\"\" style=\"opacity: 0; transition: opacity 1.2s ease; margin: 0; font-size: clamp(15px,2vw,19px); color: #6f8a83; letter-spacing: 0.04em;\">The market does not reward obedience to me.<\u002Fp>\n      <p data-reveal=\"\" style=\"opacity: 0; transition: opacity 1.2s ease .25s; margin: 18px 0 0; font-size: clamp(15px,2vw,19px); color: #aebfb9; letter-spacing: 0.04em;\">It rewards obedience to science and evidence.<\u002Fp>\n      <h2 data-reveal=\"\" style=\"opacity: 0; transition: opacity 1.4s ease .6s; margin: clamp(40px,8vh,80px) 0 0; font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-size: clamp(1.7rem, 4.4vw, 3.6rem); line-height: 1.0; color: var(--signal); text-transform: uppercase; text-shadow: 0 0 44px rgba(47,224,196,0.35); max-width: 18ch;\">Most startups fail because founders mistake <span style=\"color: var(--alert); text-shadow: none;\">conviction<\u002Fspan> for <span data-scan=\"\">evidence.<\u002Fspan><\u002Fh2>\n    <\u002Fsection>\n\n    <!-- 12 · THE OPERATOR (human voice) -->\n    <section data-panel=\"\" data-title=\"12 · THE OPERATOR\" id=\"operator\" data-zone=\"signal\" data-screen-label=\"12 The Operator\" style=\"max-width: 920px; margin: 0 auto; padding: clamp(80px,13vh,150px) 26px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.3em; color: #5f7a73; margin-bottom: 30px;\">12 / THE OPERATOR<\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"opacity: 0; transition: opacity .9s ease; margin: 0 0 34px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: clamp(1.55rem, 3.6vw, 2.9rem); line-height: 1.0; color: var(--ink); text-transform: uppercase;\">I am difficult. <span data-scan=\"\" style=\"color: var(--signal);\">The math isn’t.<\u002Fspan><\u002Fh2>\n      <div data-reveal=\"\" style=\"opacity: 0; transition: opacity .9s ease .1s; display: flex; flex-direction: column; gap: 18px; font-size: clamp(16px,2vw,20px); line-height: 1.6; color: #c4d4ce; max-width: 680px;\">\n        <p style=\"margin: 0;\">I will challenge your favorite assumptions, poke
